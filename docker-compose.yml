# Every ${VAR:-default} below can be overridden from a `.env` file next to this one
# (gitignored; see .env.example). Without a .env, the defaults are the local/test values,
# so `docker compose up` works as is.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payflow}
      POSTGRES_DB: ${POSTGRES_DB:-payflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the separate payflow_test database used by the test suite.
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    # Pure cache: no persistence needed (Postgres is the source of truth). Every key
    # has a TTL, so volatile-lru can evict safely under memory pressure.
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      target: runtime
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-payflow}:${POSTGRES_PASSWORD:-payflow}@db:5432/${POSTGRES_DB:-payflow}
      REDIS_URL: redis://redis:6379/0
      PAYFLOW_WEBHOOK_SECRET: ${PAYFLOW_WEBHOOK_SECRET:-whsec_test_123}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      # Separate database and Redis DB: the test suite never touches the service's data.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-payflow}:${POSTGRES_PASSWORD:-payflow}@db:5432/payflow_test
      REDIS_URL: redis://redis:6379/15
      PAYFLOW_WEBHOOK_SECRET: ${PAYFLOW_WEBHOOK_SECRET:-whsec_test_123}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
